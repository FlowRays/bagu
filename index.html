<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM/VLM 八股笔记</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="assets/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #faf9f5; --panel: #f0eee6; --text: #29261b; --muted: #73726c;
  --accent: #c2410c; --border: #e3e1d7; --code-bg: #f4f3ec; --inline-code: rgba(0,0,0,.055);
  --active-bg: rgba(194,65,12,.09); --ok: #3d8b5f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262624; --panel: #1f1e1b; --text: #e8e6df; --muted: #9a988f;
    --accent: #e08b5d; --border: #3a3833; --code-bg: #1e1d1a; --inline-code: rgba(255,255,255,.09);
    --active-bg: rgba(224,139,93,.14); --ok: #6cc08b;
  }
}
* { box-sizing: border-box; }
/* 只允许侧边栏和正文各自内部滚动，文档本身不滚动；
   html 也涂背景色，避免橡皮筋回弹时露出白底。 */
html {
  height: 100%; overflow: hidden; background: var(--bg);
  overscroll-behavior: none;
}
body {
  margin: 0; height: 100%; overflow: hidden; display: flex;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
}
#sidebar {
  width: 218px; flex-shrink: 0; height: 100%; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 10px 8px 40px;
  line-height: 1.25;
}
#sidebar h1 { font-size: 14px; margin: 2px 4px 8px; letter-spacing: .02em; }
#base-select {
  width: 100%; font: inherit; font-size: 14px; font-weight: 700; color: var(--text);
  background: transparent; border: 1px solid transparent; border-radius: 6px;
  padding: 3px 6px; cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 10px center, right 5px center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
#base-select:hover { border-color: var(--border); background-color: var(--inline-code); }
#base-select option { font-weight: 600; color: var(--text); background: var(--panel); }
#ans-toggle {
  display: block; width: calc(100% - 12px); margin: 0 6px 8px; padding: 4px 7px;
  font: inherit; font-size: 12px; text-align: left; cursor: pointer;
  color: var(--muted); background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
}
#ans-toggle:hover { color: var(--accent); border-color: var(--accent); }
#ans-toggle.on { color: var(--accent); border-color: var(--accent); background: var(--active-bg); }
#sidebar details { margin-bottom: 0; }
#sidebar details details { margin-left: 9px; }
#sidebar summary {
  cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px;
  list-style: none; user-select: none; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#sidebar summary::marker, #sidebar summary::-webkit-details-marker { display: none; }
#sidebar summary::before { content: "▸ "; color: var(--muted); font-size: 9px; }
#sidebar details[open] > summary::before { content: "▾ "; }
#sidebar summary:hover { background: var(--inline-code); }
#sidebar .empty { font-size: 11.5px; color: var(--muted); padding: 1px 6px 2px 18px; font-style: italic; }
#sidebar a.doc {
  display: block; font-size: 12.5px; color: var(--muted); text-decoration: none;
  padding: 2px 6px 2px 17px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#sidebar a.doc:hover { background: var(--inline-code); color: var(--text); }
#sidebar a.doc.active { background: var(--active-bg); color: var(--accent); font-weight: 600; }
#sidebar a.root { padding-left: 6px; font-weight: 600; color: var(--text); }
#main { flex: 1; height: 100%; overflow-y: auto; }
#content { max-width: 1150px; margin: 0 auto; padding: 28px 36px 100px; }
#content .err { color: var(--muted); margin-top: 80px; text-align: center; }

/* ---------- markdown 渲染 ---------- */
.md { line-height: 1.62; word-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.25em 0 .45em; font-weight: 700; }
.md h1 { font-size: 1.6em; }
.md h2 { font-size: 1.32em; padding-bottom: .2em; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 1.12em; }
.md h4 { font-size: 1em; }
.md p { margin: .55em 0; }
.md ul, .md ol { padding-left: 1.5em; margin: .4em 0; }
.md li { margin: .18em 0; }
.md li > p { margin: .18em 0; }
.md blockquote {
  margin: .7em 0; padding: .05em .9em; color: var(--muted);
  border-left: 3px solid var(--accent); background: var(--inline-code); border-radius: 0 8px 8px 0;
}
/* 自测题答案：全局开关控制显示/隐藏（侧边栏「答案」按钮） */
.md blockquote.answer { border-left-color: var(--ok); color: var(--text); }
body.hide-answers .md blockquote.answer { display: none; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }
.md img { max-width: 100%; border-radius: 8px; }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md strong { font-weight: 700; }
.md code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: .875em; background: var(--inline-code); padding: .15em .4em; border-radius: 5px;
}
.md pre {
  position: relative; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; overflow-x: auto; line-height: 1.55; margin: .7em 0;
}
.md pre code, .md pre code.hljs { background: transparent; padding: 0; font-size: 13px; }
.md pre .copy {
  position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 10px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--muted);
  cursor: pointer; opacity: 0; transition: opacity .15s;
}
.md pre:hover .copy { opacity: 1; }
.md pre .copy:hover { color: var(--accent); }
.md .tw { overflow-x: auto; margin: .7em 0; }
.md table { border-collapse: collapse; font-size: .9em; min-width: 50%; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.md th { background: var(--panel); font-weight: 600; }
.md input[type=checkbox] { margin-right: .4em; }
.md .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.md .katex { font-size: 1.06em; }
</style>
</head>
<body>
<aside id="sidebar"><h1><select id="base-select" title="切换知识库"></select></h1><button id="ans-toggle" type="button"></button><div id="tree">加载目录…</div></aside>
<main id="main"><article id="content" class="md"></article></main>
<script src="assets/marked.min.js"></script>
<script src="assets/highlight.min.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script>
const $content = document.getElementById('content');
const $tree = document.getElementById('tree');
/* ---- 私密笔记: 仓库里只有密文, 密码在浏览器里派生密钥解密 ----
   静态托管没有服务端, 任何"输密码放行"都能绕过, 所以只能做客户端加密。
   安全上限由密码熵决定: 拿到密文可以离线爆破, 高迭代 PBKDF2 只能拖慢。
   生成: python3 tools/encrypt_private.py */
let PRIV = null;                      /* private/index.json */
let privKey = null;                   /* 解出来的 CryptoKey, 缓存在内存 */

const b64d = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));

async function deriveKey(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64d(PRIV.salt), iterations: PRIV.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}

/* 记住已解出的密钥, 免得每次都输密码 */
async function cachedKey() {
  if (privKey) return privKey;
  let raw = null;
  try { raw = localStorage.getItem('privKey'); } catch (e) { /* 隐私模式 */ }
  if (raw) {
    try {
      privKey = await crypto.subtle.importKey('raw', b64d(raw),
        { name: 'AES-GCM' }, true, ['decrypt']);
      return privKey;
    } catch (e) { /* 坏了就当没有 */ }
  }
  return null;
}
async function rememberKey(k) {
  privKey = k;
  try { localStorage.setItem('privKey', b64e(await crypto.subtle.exportKey('raw', k))); }
  catch (e) { /* 隐私模式下就只留在内存 */ }
}
function forgetKey() {
  privKey = null;
  try { localStorage.removeItem('privKey'); } catch (e) { /* noop */ }
}

/* 取一篇私密笔记的明文; 密码错或没输就返回 null */
async function fetchPrivate(path) {
  const res = await fetch(PRIV.files[path], { cache: 'no-store' });
  if (!res.ok) throw new Error(`密文取不到 (${res.status})`);
  const blob = await res.json();
  for (let tries = 0; tries < 3; tries++) {
    let key = await cachedKey();
    if (!key) {
      const pw = prompt('这篇是私密笔记，请输入密码：');
      if (!pw) return null;
      key = await deriveKey(pw);          /* 600k 次迭代, 约 0.3~1 秒 */
    }
    try {
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64d(blob.iv) }, key, b64d(blob.ct));
      await rememberKey(key);             /* 解开了才记住 */
      return new TextDecoder().decode(pt);
    } catch (e) {
      forgetKey();                        /* GCM 校验失败 = 密码不对 */
      if (tries === 2) { alert('密码错误'); return null; }
      alert('密码错误，请重试');
    }
  }
  return null;
}

/* ---- math: 先保护代码, 再抽出公式占位, 渲染后回填 katex ---- */
function renderMarkdown(src) {
  const codes = [], maths = [];
  let s = src.replace(/```[\s\S]*?(?:```|$)|``[^`]*``|`[^`\n]*`/g,
    m => `${codes.push(m) - 1}`);
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => `${maths.push({ t, d: 1 }) - 1}`)
       .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => `${maths.push({ t, d: 1 }) - 1}`)
       .replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => `${maths.push({ t, d: 0 }) - 1}`)
       .replace(/\$(?!\s)([^$\n]*?[^\s$])\$/g, (m, t) => `${maths.push({ t, d: 0 }) - 1}`);
  s = s.replace(/(\d+)/g, (m, i) => codes[+i]);
  let html = marked.parse(s);
  return html.replace(/(\d+)/g, (m, i) => {
    const { t, d } = maths[+i];
    try { return katex.renderToString(t, { displayMode: !!d, throwOnError: false }); }
    catch (e) { return t; }
  });
}

/* ---- 目录树来自 notes.json (由 tools/build_manifest.py 生成) ----
   GitHub Pages 不提供目录列表, 所以清单必须是静态文件; 本地也走同一条路径。 */
let BASES = [];                       /* 多知识库清单, 见 tools/build_manifest.py */
async function loadManifest() {
  const res = await fetch('notes.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`notes.json ${res.status}，请运行 python3 tools/build_manifest.py`);
  const m = await res.json();
  return m.bases;
}
/* 一个文档属于哪个知识库: 按目录前缀或大纲文件名判断 */
function baseOf(path) {
  return BASES.find(b => path === b.root || path.startsWith(b.tree.path)) || BASES[0];
}
const nameOf = p => decodeURIComponent(p.split('/').filter(Boolean).pop())
  .replace(/\.md$/, '').replace(/^\d+-/, '');

function renderNode(node) {
  const det = document.createElement('details');
  det.open = false;                     /* 默认折叠，只展开当前文档所在的那条路径 */
  const sum = document.createElement('summary');
  sum.textContent = nameOf(node.path);
  det.appendChild(sum);
  for (const f of node.files) det.appendChild(docLink(f));
  for (const d of node.dirs) det.appendChild(renderNode(d));
  if (!node.files.length && !node.dirs.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = '(空)';
    det.appendChild(e);
  }
  return det;
}
function docLink(path, cls = 'doc') {
  const a = document.createElement('a');
  a.className = cls; a.href = '#' + path; a.dataset.path = path;
  a.textContent = nameOf(path);
  return a;
}

/* github 风格 slug: 小写, 去标点, 空格转连字符, 保留中文 */
const slug = s => s.trim().toLowerCase()
  .replace(/[^\w一-鿿\- ]/g, '').replace(/ /g, '-');

/* ---- 加载并渲染一篇笔记 ---- */
async function load(path, anchor) {
  path = decodeURIComponent(path);
  let text;
  try {
    if (PRIV && PRIV.files[path]) {          /* 私密笔记: 取密文再解密 */
      text = await fetchPrivate(path);
      if (text === null) {
        $content.innerHTML = '<p class="err">需要密码才能查看这篇笔记</p>';
        return;
      }
    } else {
      const res = await fetch(encodeURI(path), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      text = await res.text();
    }
  } catch (e) {
    $content.innerHTML = `<p class="err">无法加载 ${path} (${e.message})</p>`;
    return;
  }
  $content.innerHTML = renderMarkdown(text);
  document.title = nameOf(path) + ' · 八股笔记';
  const base = path.slice(0, path.lastIndexOf('/') + 1);
  $content.querySelectorAll('img').forEach(im => {
    const s = im.getAttribute('src');
    if (s && !/^([a-z]+:|\/|#)/i.test(s)) im.src = base + s;
  });
  $content.querySelectorAll('h1,h2,h3,h4').forEach(h => h.id = slug(h.textContent));
  /* 以「答：」开头的引用块 = 自测题答案，受侧边栏全局开关控制 */
  $content.querySelectorAll('blockquote').forEach(b => {
    if (/^\s*答\s*[:：]/.test(b.textContent)) b.classList.add('answer');
  });
  $content.querySelectorAll('a').forEach(a => {
    const h = a.getAttribute('href') || '';
    if (/^([a-z]+:|#)/i.test(h)) { if (/^[a-z]+:/i.test(h)) a.target = '_blank'; return; }
    const i = h.indexOf('#'), frag = i < 0 ? '' : h.slice(i), href = i < 0 ? h : h.slice(0, i);
    const t = href.startsWith('/') ? href.slice(1) : base + href;
    if (t.toLowerCase().endsWith('.md')) a.href = '#' + t + frag; else a.href = t + frag;
  });
  $content.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  $content.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = '复制';
    b.onclick = async () => {
      const code = pre.querySelector('code')?.innerText ?? pre.innerText;
      try { await navigator.clipboard.writeText(code); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      b.textContent = '已复制'; setTimeout(() => b.textContent = '复制', 1200);
    };
    pre.appendChild(b);
  });
  $content.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tw';
    t.replaceWith(w); w.appendChild(t);
  });
  document.querySelectorAll('#sidebar a').forEach(a =>
    a.classList.toggle('active', a.dataset.path === path));
  /* 展开当前文档所在的目录链，并滚到可见处 */
  const cur = document.querySelector('#sidebar a.doc.active');
  if (cur) {
    for (let d = cur.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
    if (cur.scrollIntoViewIfNeeded) cur.scrollIntoViewIfNeeded();
    else cur.scrollIntoView({ block: 'nearest' });
  }
  const target = anchor && $content.querySelector('#' + CSS.escape(decodeURIComponent(anchor)));
  if (target) target.scrollIntoView(); else document.getElementById('main').scrollTop = 0;
}

/* ---- 全局开关：显示 / 隐藏所有页面的自测题答案（记住选择） ---- */
const $ans = document.getElementById('ans-toggle');
let hideAnswers = false;
try { hideAnswers = localStorage.getItem('hideAnswers') === '1'; } catch (e) { /* 隐私模式等 */ }
function applyAnswers() {
  document.body.classList.toggle('hide-answers', hideAnswers);
  $ans.classList.toggle('on', hideAnswers);
  $ans.textContent = hideAnswers ? '答案：已隐藏（点击显示）' : '答案：显示中（点击隐藏）';
}
$ans.addEventListener('click', () => {
  hideAnswers = !hideAnswers;
  try { localStorage.setItem('hideAnswers', hideAnswers ? '1' : '0'); } catch (e) { /* 忽略 */ }
  applyAnswers();
});

const $baseSel = document.getElementById('base-select');
let curBase = null;

/* 渲染某个知识库的目录树 */
async function renderBase(base) {
  curBase = base;
  $baseSel.value = base.id;
  $tree.innerHTML = '';
  $tree.appendChild(docLink(base.root, 'doc root'));
  for (const f of base.tree.files) $tree.appendChild(docLink(f));
  /* 私密笔记: 仓库里只有密文, 点开时要密码 */
  if (PRIV) {
    for (const p of Object.keys(PRIV.files)) {
      if (!p.startsWith(base.tree.path)) continue;
      const a = docLink(p);
      a.textContent = '🔒 ' + a.textContent;
      $tree.appendChild(a);
    }
  }
  for (const d of base.tree.dirs) $tree.appendChild(renderNode(d));
  try { localStorage.setItem('base', base.id); } catch (e) { /* 隐私模式等 */ }
}

(async function init() {
  marked.use({ gfm: true, mangle: false, headerIds: false });
  applyAnswers();
  try {
    BASES = await loadManifest();
    try { PRIV = await (await fetch('private/index.json', { cache: 'no-store' })).json(); }
    catch (e) { PRIV = null; }              /* 没有私密笔记就当没有 */
    $baseSel.innerHTML = '';
    for (const b of BASES) {
      const o = document.createElement('option');
      o.value = b.id; o.textContent = b.title;
      $baseSel.appendChild(o);
    }
    /* 切换知识库时跳到它的大纲页 */
    $baseSel.addEventListener('change', () => {
      const b = BASES.find(x => x.id === $baseSel.value);
      if (b) location.hash = b.root;
    });
    let saved = null;
    try { saved = localStorage.getItem('base'); } catch (e) { /* 隐私模式等 */ }
    /* 深链优先: hash 指向哪个库就先显示哪个 */
    const h0 = location.hash.slice(1).split('#')[0];
    const initial = (h0 && BASES.find(b => h0 === b.root || h0.startsWith(b.tree.path)))
                 || BASES.find(b => b.id === saved) || BASES[0];
    await renderBase(initial);
  } catch (e) { $tree.textContent = '目录加载失败: ' + e; }
  const go = async () => {
    const h = location.hash.slice(1) || (curBase ? curBase.root : 'bagu.md');
    const i = h.indexOf('#');
    const path = i < 0 ? h : h.slice(0, i);
    const b = baseOf(path);
    if (b && curBase && b.id !== curBase.id) await renderBase(b);   /* 深链跨库时自动切换 */
    load(path, i < 0 ? '' : h.slice(i + 1));
  };
  window.addEventListener('hashchange', go);
  go();
})().catch(e => { $tree.textContent = '初始化失败: ' + e; });
</script>
</body>
</html>
